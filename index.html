<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presenze Ancora">
<title>L'Ancora — Presenze</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{
  --navy:#0d1f2d;--ocean:#1a3a4a;--teal:#0e7c7b;--teal-l:#12a09f;
  --gold:#c9a84c;--gold-l:#e8c97a;--danger:#e05c5c;--success:#4caf82;
  --muted:#8aa0ad;--card:#112232;--border:rgba(14,124,123,0.25)
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:#fff;min-height:100vh;overflow-x:hidden}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--ocean),var(--navy));padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.hdr-logo{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold)}
.hdr-sub{font-size:0.6rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.hdr-ora{font-size:0.78rem;color:var(--teal-l);font-weight:500}

/* SCHERMATE */
.screen{display:none;padding:20px 16px;min-height:calc(100vh - 70px)}
.screen.on{display:block}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.card-t{font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);margin-bottom:14px}

/* BOTTONI NOMI */
.nomi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.nome-btn{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:22px 10px;cursor:pointer;text-align:center;transition:all 0.2s;font-family:'DM Sans',sans-serif}
.nome-btn:active{transform:scale(0.96)}
.nome-btn.cucina{border-color:rgba(14,124,123,0.5)}
.nome-btn.sala{border-color:rgba(201,168,76,0.5)}
.nome-btn .nome-ico{font-size:2.2rem;margin-bottom:6px}
.nome-btn .nome-txt{font-size:1rem;font-weight:600;color:#fff}
.nome-btn .nome-rep{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.nome-btn.selected.cucina{background:rgba(14,124,123,0.2);border-color:var(--teal-l)}
.nome-btn.selected.sala{background:rgba(201,168,76,0.12);border-color:var(--gold)}
.nome-full{grid-column:1/-1}

/* BOTTONI AZIONE */
.azioni-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.az-btn{border:none;border-radius:14px;padding:20px 10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;transition:all 0.2s;text-align:center}
.az-btn:active{transform:scale(0.96)}
.az-btn .az-ico{font-size:1.8rem;display:block;margin-bottom:6px}
.az-entrata{background:var(--success);color:#fff}
.az-uscita{background:var(--danger);color:#fff}
.az-ferie{background:rgba(201,168,76,0.2);border:2px solid var(--gold);color:var(--gold-l)}
.az-malattia{background:rgba(224,92,92,0.15);border:2px solid var(--danger);color:#ff9999}

/* STATUS */
.status-box{background:rgba(14,124,123,0.1);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.status-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.status-row:last-child{border-bottom:none}
.status-tipo{font-size:0.82rem;font-weight:600}
.status-ora{font-size:0.78rem;color:var(--muted)}

/* LISTA DIPENDENTI ADMIN */
.dip-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,0.04);margin-bottom:8px;border:1px solid var(--border)}
.dip-nome{font-weight:600;font-size:0.9rem}
.dip-rep{font-size:0.65rem;color:var(--muted);margin-top:2px}
.dip-stato{font-size:0.8rem;font-weight:600}
.stato-entrata{color:var(--success)}
.stato-uscita{color:var(--danger)}
.stato-ferie{color:var(--gold)}
.stato-malattia{color:#ff9999}
.stato-assente{color:var(--muted)}

/* REPORT TABELLA */
.rep-table{width:100%;border-collapse:collapse;font-size:0.78rem}
.rep-table th{text-align:left;padding:8px 6px;color:var(--muted);border-bottom:1px solid var(--border);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.5px}
.rep-table td{padding:9px 6px;border-bottom:1px solid rgba(14,124,123,0.1)}
.rep-table tr:last-child td{border-bottom:none}

/* BUTTONS */
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;text-align:center;transition:opacity 0.2s,transform 0.1s;margin-top:10px}
.btn:active{transform:scale(0.98)}
.btn-g{background:var(--gold);color:var(--navy)}
.btn-t{background:var(--teal);color:#fff}
.btn-d{background:var(--danger);color:#fff}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-sm{display:inline-block;width:auto;padding:7px 14px;font-size:0.78rem;margin-top:0}

/* NAV BOTTOM */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--ocean);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;padding:8px 2px 12px;background:none;border:none;color:var(--muted);font-size:0.6rem;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.2s;font-family:'DM Sans',sans-serif}
.nb .ic{font-size:1.3rem}
.nb.on{color:var(--gold)}

/* FORM */
label{display:block;font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;margin-top:12px}
input,select{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:9px;padding:11px 13px;color:#fff;font-family:'DM Sans',sans-serif;font-size:0.88rem;outline:none;transition:border-color 0.2s;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--teal-l)}
select option{background:var(--ocean)}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;padding:12px 24px;border-radius:30px;font-size:0.88rem;font-weight:600;z-index:999;opacity:0;transition:opacity 0.3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}

/* EMPTY */
.empty{text-align:center;padding:30px 20px;color:var(--muted);font-size:0.85rem}
.empty-ico{font-size:2.5rem;margin-bottom:10px}

/* PIN */
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
.pin-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;font-size:1.2rem;font-weight:600;cursor:pointer;text-align:center;color:#fff;font-family:'DM Sans',sans-serif}
.pin-btn:active{background:var(--teal);border-color:var(--teal)}
.pin-display{text-align:center;font-size:2rem;letter-spacing:8px;color:var(--gold);margin-bottom:20px;min-height:40px}

body{padding-bottom:70px}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div>
    <div class="hdr-logo">L'Ancora</div>
    <div class="hdr-sub">Registro Presenze</div>
  </div>
  <div class="hdr-ora" id="oraCorrente"></div>
</header>

<!-- ══ SCHERMATA: TIMBRA ══ -->
<div class="screen on" id="sc-timbra">
  <div style="text-align:center;margin-bottom:20px">
    <div style="font-size:1.1rem;font-weight:600;color:var(--gold)" id="data-oggi"></div>
    <div style="font-size:0.78rem;color:var(--muted);margin-top:4px">Seleziona il tuo nome e timbra</div>
  </div>

  <!-- Selezione nome -->
  <div class="nomi-grid">
    <button class="nome-btn cucina" onclick="selNome('Adam',this)">
      <div class="nome-ico">👨‍🍳</div>
      <div class="nome-txt">Adam</div>
      <div class="nome-rep">Cucina</div>
    </button>
    <button class="nome-btn cucina" onclick="selNome('Alessio',this)">
      <div class="nome-ico">👨‍🍳</div>
      <div class="nome-txt">Alessio</div>
      <div class="nome-rep">Cucina</div>
    </button>
    <button class="nome-btn cucina" onclick="selNome('Dalia',this)">
      <div class="nome-ico">👩‍🍳</div>
      <div class="nome-txt">Dalia</div>
      <div class="nome-rep">Cucina</div>
    </button>
    <button class="nome-btn sala" onclick="selNome('Roberta',this)">
      <div class="nome-ico">🍽️</div>
      <div class="nome-txt">Roberta</div>
      <div class="nome-rep">Sala</div>
    </button>
    <button class="nome-btn sala nome-full" onclick="selNome('Stefano',this)">
      <div class="nome-ico">🍽️</div>
      <div class="nome-txt">Stefano</div>
      <div class="nome-rep">Sala</div>
    </button>
  </div>

  <!-- Stato oggi -->
  <div id="stato-oggi-box" style="display:none">
    <div class="card">
      <div class="card-t" id="stato-nome-label">Le tue timbrature oggi</div>
      <div class="status-box" id="status-timbrature">
        <div class="empty"><div class="empty-ico">🕐</div>Nessuna timbratura oggi</div>
      </div>

      <!-- Azioni -->
      <div class="azioni-grid">
        <button class="az-btn az-entrata" onclick="timbra('entrata')">
          <span class="az-ico">🟢</span>Entrata
        </button>
        <button class="az-btn az-uscita" onclick="timbra('uscita')">
          <span class="az-ico">🔴</span>Uscita
        </button>
        <button class="az-btn az-ferie" onclick="timbra('ferie')">
          <span class="az-ico">🏖️</span>Ferie
        </button>
        <button class="az-btn az-malattia" onclick="timbra('malattia')">
          <span class="az-ico">🤒</span>Malattia
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ══ SCHERMATA: OGGI (ADMIN) ══ -->
<div class="screen" id="sc-oggi">
  <div class="card">
    <div class="card-t">📋 Presenze di Oggi</div>
    <div id="oggi-data" style="font-size:0.8rem;color:var(--muted);margin-bottom:14px"></div>
    <div id="oggi-lista">
      <div class="empty"><div class="empty-ico">👥</div>Caricamento...</div>
    </div>
  </div>
</div>

<!-- ══ SCHERMATA: REPORT ══ -->
<div class="screen" id="sc-report">
  <div id="sc-report-pin" style="display:block">
    <div class="card" style="text-align:center">
      <div class="card-t">🔐 Area Admin</div>
      <div style="font-size:0.82rem;color:var(--muted);margin-bottom:20px">Inserisci PIN per accedere ai report</div>
      <div class="pin-display" id="pin-display">——</div>
      <div class="pin-grid">
        <button class="pin-btn" onclick="pinTasto('1')">1</button>
        <button class="pin-btn" onclick="pinTasto('2')">2</button>
        <button class="pin-btn" onclick="pinTasto('3')">3</button>
        <button class="pin-btn" onclick="pinTasto('4')">4</button>
        <button class="pin-btn" onclick="pinTasto('5')">5</button>
        <button class="pin-btn" onclick="pinTasto('6')">6</button>
        <button class="pin-btn" onclick="pinTasto('7')">7</button>
        <button class="pin-btn" onclick="pinTasto('8')">8</button>
        <button class="pin-btn" onclick="pinTasto('9')">9</button>
        <button class="pin-btn" onclick="pinCanc()" style="color:var(--danger)">✕</button>
        <button class="pin-btn" onclick="pinTasto('0')">0</button>
        <button class="pin-btn" onclick="pinOk()" style="background:var(--teal);border-color:var(--teal)">✓</button>
      </div>
    </div>
  </div>

  <div id="sc-report-body" style="display:none">
    <div class="card">
      <div class="card-t">📊 Report Mensile</div>
      <label>Seleziona mese</label>
      <select id="mese-sel" onchange="caricaReport()"></select>
      <div id="report-contenuto" style="margin-top:16px"></div>
      <button class="btn btn-g" onclick="scaricaPDF()" style="margin-top:14px">⬇️ Scarica PDF</button>
      <button class="btn btn-o" onclick="document.getElementById('sc-report-pin').style.display='block';document.getElementById('sc-report-body').style.display='none'">🔒 Blocca</button>
    </div>
  </div>
</div>

<!-- ══ NAV BOTTOM ══ -->
<nav class="nav">
  <button class="nb on" id="nb-timbra" onclick="showScreen('timbra')">
    <span class="ic">⏱️</span>Timbra
  </button>
  <button class="nb" id="nb-oggi" onclick="showScreen('oggi')">
    <span class="ic">👥</span>Oggi
  </button>
  <button class="nb" id="nb-report" onclick="showScreen('report')">
    <span class="ic">📊</span>Report
  </button>
</nav>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ══ FIREBASE CONFIG ══
const firebaseConfig = {
  apiKey: "AIzaSyCiq4s0XNvXWe90VU1cYIZ8KyXLJpD3OXM",
  authDomain: "lancora-haccp.firebaseapp.com",
  databaseURL: "https://lancora-haccp-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lancora-haccp",
  storageBucket: "lancora-haccp.firebasestorage.app",
  messagingSenderId: "263121790360",
  appId: "1:263121790360:web:18fbd1a9c0dff6809eb7ed"
};

// Usa la stessa config del firebase-config.js se disponibile
let db;
try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(e) {
  console.error('Firebase init error:', e);
}

// ══ COSTANTI ══
const DIPENDENTI = [
  {nome:'Adam',   reparto:'Cucina', ico:'👨‍🍳'},
  {nome:'Alessio',reparto:'Cucina', ico:'👨‍🍳'},
  {nome:'Dalia',  reparto:'Cucina', ico:'👩‍🍳'},
  {nome:'Roberta',reparto:'Sala',   ico:'🍽️'},
  {nome:'Stefano',reparto:'Sala',   ico:'🍽️'},
];
const PIN_ADMIN = '1503';

// ══ STATO ══
let nomeSelezionato = null;
let pinCorrente = '';

// ══ UTILS ══
function oggi() {
  return new Date().toISOString().slice(0,10);
}
function oraAdesso() {
  return new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}
function fmtData(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

// ══ OROLOGIO ══
function aggiornaOra() {
  document.getElementById('oraCorrente').textContent = oraAdesso();
}
setInterval(aggiornaOra, 1000);
aggiornaOra();

// ══ NAVIGAZIONE ══
function showScreen(nome) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
  document.getElementById('sc-' + nome).classList.add('on');
  document.getElementById('nb-' + nome).classList.add('on');
  if (nome === 'oggi') caricaOggi();
}

// ══ SELEZIONE NOME ══
function selNome(nome, btn) {
  nomeSelezionato = nome;
  document.querySelectorAll('.nome-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('stato-nome-label').textContent = nome + ' — oggi';
  document.getElementById('stato-oggi-box').style.display = 'block';
  caricaStatoOggi(nome);
}

// ══ TIMBRA ══
async function timbra(tipo) {
  if (!nomeSelezionato) { mostraToast('Seleziona prima il tuo nome!'); return; }
  const ora = oraAdesso();
  const docId = nomeSelezionato + '_' + oggi();
  try {
    const ref = db.collection('presenze').doc(docId);
    const doc = await ref.get();
    const dati = doc.exists ? doc.data() : {nome: nomeSelezionato, data: oggi(), timbrature: []};
    dati.timbrature = dati.timbrature || [];
    dati.timbrature.push({tipo, ora, ts: Date.now()});
    await ref.set(dati);
    const msg = {
      entrata:  '✅ Entrata registrata alle ' + ora,
      uscita:   '✅ Uscita registrata alle ' + ora,
      ferie:    '🏖️ Ferie registrate per oggi',
      malattia: '🤒 Malattia registrata per oggi'
    }[tipo];
    mostraToast(msg);
    caricaStatoOggi(nomeSelezionato);
  } catch(e) {
    mostraToast('❌ Errore: ' + e.message);
  }
}

// ══ STATO OGGI (dipendente) ══
async function caricaStatoOggi(nome) {
  const docId = nome + '_' + oggi();
  const el = document.getElementById('status-timbrature');
  try {
    const doc = await db.collection('presenze').doc(docId).get();
    if (!doc.exists || !doc.data().timbrature?.length) {
      el.innerHTML = '<div class="empty"><div class="empty-ico">🕐</div>Nessuna timbratura oggi</div>';
      return;
    }
    const timb = doc.data().timbrature;
    const icone = {entrata:'🟢',uscita:'🔴',ferie:'🏖️',malattia:'🤒'};
    const colori = {entrata:'var(--success)',uscita:'var(--danger)',ferie:'var(--gold)',malattia:'#ff9999'};
    el.innerHTML = timb.map(t =>
      '<div class="status-row"><span class="status-tipo" style="color:' + (colori[t.tipo]||'#fff') + '">' + (icone[t.tipo]||'•') + ' ' + t.tipo.charAt(0).toUpperCase()+t.tipo.slice(1) + '</span><span class="status-ora">' + t.ora + '</span></div>'
    ).join('');
  } catch(e) {
    el.innerHTML = '<div style="color:var(--danger);font-size:0.8rem">Errore caricamento</div>';
  }
}

// ══ PRESENZE OGGI (admin) ══
async function caricaOggi() {
  const el = document.getElementById('oggi-lista');
  const dataEl = document.getElementById('oggi-data');
  dataEl.textContent = fmtData(oggi());
  el.innerHTML = '<div class="empty"><div class="empty-ico">⏳</div>Caricamento...</div>';
  try {
    const snap = await db.collection('presenze').where('data','==',oggi()).get();
    const mappa = {};
    snap.forEach(d => { mappa[d.data().nome] = d.data(); });

    el.innerHTML = DIPENDENTI.map(dip => {
      const dati = mappa[dip.nome];
      const timb = dati?.timbrature || [];
      const ultima = timb.length ? timb[timb.length-1] : null;
      const icone = {entrata:'🟢',uscita:'🔴',ferie:'🏖️',malattia:'🤒'};
      const cls = ultima ? 'stato-'+ultima.tipo : 'stato-assente';
      const testo = ultima
        ? (icone[ultima.tipo]||'') + ' ' + ultima.tipo.charAt(0).toUpperCase()+ultima.tipo.slice(1) + ' ' + ultima.ora
        : '— Non presente';

      // Calcola ore se c'è entrata e uscita
      let oreExtra = '';
      const entrata = timb.find(t => t.tipo==='entrata');
      const uscita = timb.find(t => t.tipo==='uscita');
      if (entrata && uscita) {
        const [he,me] = entrata.ora.split(':').map(Number);
        const [hu,mu] = uscita.ora.split(':').map(Number);
        const ore = ((hu*60+mu)-(he*60+me))/60;
        oreExtra = '<div style="font-size:0.65rem;color:var(--teal-l);margin-top:2px">⏱ ' + ore.toFixed(1) + 'h lavorate</div>';
      }

      return '<div class="dip-row"><div><div class="dip-nome">' + dip.ico + ' ' + dip.nome + '</div><div class="dip-rep">' + dip.reparto + '</div>' + oreExtra + '</div><div class="dip-stato ' + cls + '">' + testo + '</div></div>';
    }).join('');
  } catch(e) {
    el.innerHTML = '<div style="color:var(--danger);font-size:0.82rem;padding:12px">Errore: ' + e.message + '</div>';
  }
}

// ══ PIN ADMIN ══
function pinTasto(c) {
  if (pinCorrente.length >= 4) return;
  pinCorrente += c;
  document.getElementById('pin-display').textContent = '●'.repeat(pinCorrente.length) + '—'.repeat(4-pinCorrente.length);
}
function pinCanc() {
  pinCorrente = '';
  document.getElementById('pin-display').textContent = '——';
}
function pinOk() {
  if (pinCorrente === PIN_ADMIN) {
    document.getElementById('sc-report-pin').style.display = 'none';
    document.getElementById('sc-report-body').style.display = 'block';
    pinCorrente = '';
    document.getElementById('pin-display').textContent = '——';
    popolaMesi();
    caricaReport();
  } else {
    mostraToast('❌ PIN errato');
    pinCanc();
  }
}

// ══ REPORT ══
function popolaMesi() {
  const sel = document.getElementById('mese-sel');
  sel.innerHTML = '';
  const ora = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(ora.getFullYear(), ora.getMonth()-i, 1);
    const val = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
    sel.innerHTML += '<option value="' + val + '">' + label.charAt(0).toUpperCase()+label.slice(1) + '</option>';
  }
}

async function caricaReport() {
  const mese = document.getElementById('mese-sel').value;
  const el = document.getElementById('report-contenuto');
  el.innerHTML = '<div class="empty"><div class="empty-ico">⏳</div>Caricamento...</div>';
  try {
    const inizio = mese + '-01';
    const fine = mese + '-31';
    const snap = await db.collection('presenze')
      .where('data','>=',inizio)
      .where('data','<=',fine)
      .get();

    // Raggruppa per dipendente
    const datiDip = {};
    DIPENDENTI.forEach(d => { datiDip[d.nome] = {giorni:[], ferie:0, malattia:0, giorniLav:0, oreTotal:0}; });
    snap.forEach(doc => {
      const d = doc.data();
      if (!datiDip[d.nome]) return;
      const timb = d.timbrature || [];
      const haFerie = timb.some(t => t.tipo==='ferie');
      const haMalattia = timb.some(t => t.tipo==='malattia');
      const entrata = timb.find(t => t.tipo==='entrata');
      const uscita = timb.find(t => t.tipo==='uscita');
      if (haFerie) datiDip[d.nome].ferie++;
      else if (haMalattia) datiDip[d.nome].malattia++;
      else if (entrata) {
        datiDip[d.nome].giorniLav++;
        if (uscita) {
          const [he,me] = entrata.ora.split(':').map(Number);
          const [hu,mu] = uscita.ora.split(':').map(Number);
          datiDip[d.nome].oreTotal += ((hu*60+mu)-(he*60+me))/60;
        }
      }
      datiDip[d.nome].giorni.push(d.data);
    });

    // Renderizza
    const nomeMese = new Date(mese+'-15').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
    el.innerHTML = '<div style="font-weight:700;color:var(--gold);margin-bottom:14px;text-align:center">' + nomeMese.charAt(0).toUpperCase()+nomeMese.slice(1) + '</div>' +
      DIPENDENTI.map(dip => {
        const r = datiDip[dip.nome];
        return '<div style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px">' +
          '<div style="font-weight:700;color:#fff;margin-bottom:10px">' + dip.ico + ' ' + dip.nome + ' <span style="font-size:0.68rem;color:var(--muted);font-weight:400">(' + dip.reparto + ')</span></div>' +
          '<table class="rep-table"><thead><tr><th>Giorni lav.</th><th>Ore tot.</th><th>Ferie</th><th>Malattia</th></tr></thead>' +
          '<tbody><tr>' +
          '<td style="color:var(--success);font-weight:700">' + r.giorniLav + '</td>' +
          '<td style="color:var(--teal-l);font-weight:700">' + r.oreTotal.toFixed(1) + 'h</td>' +
          '<td style="color:var(--gold);font-weight:700">' + r.ferie + '</td>' +
          '<td style="color:var(--danger);font-weight:700">' + r.malattia + '</td>' +
          '</tr></tbody></table></div>';
      }).join('');
  } catch(e) {
    el.innerHTML = '<div style="color:var(--danger);font-size:0.82rem">Errore: ' + e.message + '</div>';
  }
}

// ══ SCARICA PDF ══
function scaricaPDF() {
  const mese = document.getElementById('mese-sel').value;
  const contenuto = document.getElementById('report-contenuto').innerText;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text("L'Ancora — Report Presenze", 20, 20);
  doc.setFontSize(12);
  doc.setFont('helvetica','normal');
  const nomeMese = new Date(mese+'-15').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  doc.text('Mese: ' + nomeMese, 20, 32);
  doc.setFontSize(10);
  const righe = doc.splitTextToSize(contenuto, 170);
  doc.text(righe, 20, 45);
  doc.save('presenze_' + mese + '.pdf');
}

// ══ TOAST ══
function mostraToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}
