<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presenze Admin">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1f2d">
<title>L'Ancora — Presenze (Admin)</title>
<link rel="stylesheet" href="stile.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- ══ PIN ══ -->
<div class="wrap" id="v-pin">
  <div class="hdr"><div class="hdr-logo">L'Ancora</div><div class="hdr-rep">Presenze — Area riservata</div></div>
  <div class="card centro">
    <div class="piccolo muted">Inserisci il PIN</div>
    <div class="pin-display" id="pin-display">––––</div>
    <div class="pin-grid" id="pin-grid"></div>
  </div>
</div>

<!-- ══ ADMIN ══ -->
<div class="wrap wrap-largo" id="v-admin" hidden>
  <div class="hdr" style="display:flex;justify-content:space-between;align-items:center;text-align:left">
    <div><div class="hdr-logo">L'Ancora</div><div class="hdr-rep">Registro presenze</div></div>
    <div style="text-align:right">
      <div id="badge-modo"></div>
      <button class="btn btn-o btn-sm" style="margin-top:6px" onclick="esci()">🔒 Esci</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="oggi" onclick="apriTab('oggi')">👥 Oggi</button>
    <button class="tab" data-tab="report" onclick="apriTab('report')">📊 Report mensile</button>
    <button class="tab" data-tab="link" onclick="apriTab('link')">🔗 Link dipendenti</button>
  </div>

  <!-- OGGI -->
  <section id="tab-oggi">
    <div class="card">
      <div class="card-t" id="oggi-titolo">Oggi</div>
      <div id="oggi-lista"><div class="vuoto">Caricamento…</div></div>
    </div>
  </section>

  <!-- REPORT -->
  <section id="tab-report" hidden>
    <div class="card">
      <div class="filtri">
        <div><label for="sel-dip">Dipendente</label><select id="sel-dip" onchange="caricaReport()"></select></div>
        <div><label for="sel-mese">Mese</label><select id="sel-mese" onchange="caricaReport()"></select></div>
        <div class="azioni-export">
          <button class="btn btn-g" onclick="esportaPDF()">⬇️ PDF</button>
          <button class="btn btn-t" onclick="esportaExcel()">⬇️ Excel</button>
        </div>
      </div>
      <div class="kpi-riga" id="rep-kpi"></div>
      <div class="tab-scroll"><table class="rep" id="rep-tabella"></table></div>
      <div class="piccolo muted" style="margin-top:10px" id="rep-note"></div>
    </div>
  </section>

  <!-- LINK -->
  <section id="tab-link" hidden>
    <div class="card">
      <div class="card-t">Link personali</div>
      <div class="piccolo muted" style="margin-bottom:12px">Manda a ogni dipendente solo il suo link. Sul telefono: apri il link → Condividi → "Aggiungi a schermata Home".</div>
      <div id="link-lista"></div>
    </div>
  </section>
</div>

<div id="modale"></div>
<div class="toast" id="toast"></div>

<script src="presenze-core.js"></script>
<script>
// ══ PIN ══
let pin = '';
document.getElementById('pin-grid').innerHTML =
  ['1','2','3','4','5','6','7','8','9','✕','0','✓'].map(c =>
    '<button class="pin-btn" onclick="tastoPin(\'' + c + '\')"' +
    (c === '✓' ? ' style="background:var(--teal)"' : c === '✕' ? ' style="color:var(--danger)"' : '') + '>' + c + '</button>'
  ).join('');

async function sha256(testo) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(testo));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function tastoPin(c) {
  if (c === '✕') pin = '';
  else if (c === '✓') {
    const tentativo = pin;
    pin = '';
    if (await sha256(tentativo) === PIN_ADMIN_SHA256) {
      try { sessionStorage.setItem('presenze_admin', '1'); } catch (e) {}
      entra();
    } else mostraToast('PIN errato', true);
  } else if (pin.length < 6) pin += c;
  document.getElementById('pin-display').textContent = pin ? '●'.repeat(pin.length) : '––––';
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('v-pin').hidden) {
    if (/^[0-9]$/.test(e.key)) tastoPin(e.key);
    else if (e.key === 'Enter') tastoPin('✓');
    else if (e.key === 'Backspace') tastoPin('✕');
  }
});
function esci() {
  try { sessionStorage.removeItem('presenze_admin'); } catch (e) {}
  location.reload();
}

// ══ AVVIO ══
let giornataOggi = giornataDi(Date.now());
let annullaOggi = null, annullaReport = null;
let datiOggi = [], datiReport = [], meseDemoCaricato = null;
let ultimoReport = null;

function entra() {
  document.getElementById('v-pin').hidden = true;
  document.getElementById('v-admin').hidden = false;
  document.getElementById('badge-modo').innerHTML = MODALITA_DEMO
    ? '<span class="badge badge-prova">🧪 DEMO — dati inventati, nulla viene salvato</span>'
    : COLLEZIONE.includes('prova') ? '<span class="badge badge-prova">🧪 Archivio di prova</span>' : '';

  document.getElementById('sel-dip').innerHTML = Object.entries(DIPENDENTI)
    .map(([id, d]) => '<option value="' + id + '">' + d.nome + '</option>').join('');
  const ora = new Date();
  let opzioni = '';
  for (let i = 0; i < 13; i++) {
    const d = new Date(ora.getFullYear(), ora.getMonth() - i, 1);
    const val = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    opzioni += '<option value="' + val + '">' + nomeMese(val) + '</option>';
  }
  document.getElementById('sel-mese').innerHTML = opzioni;

  const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
  document.getElementById('link-lista').innerHTML = Object.values(DIPENDENTI).map(d =>
    '<div class="stato-dip"><div><div style="font-weight:600">' + d.nome + '</div><div class="piccolo muted" style="word-break:break-all">' + base + d.pagina + '</div></div>' +
    '<button class="btn btn-t btn-sm" onclick="copia(\'' + base + d.pagina + '\')">Copia</button></div>'
  ).join('');

  ascoltaOggi();
  setInterval(() => {
    const g = giornataDi(Date.now());
    if (g !== giornataOggi) { giornataOggi = g; ascoltaOggi(); }
    else renderOggi();
  }, 30000);
}

function apriTab(nome) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === nome));
  ['oggi', 'report', 'link'].forEach(n => document.getElementById('tab-' + n).hidden = n !== nome);
  if (nome === 'report') caricaReport();
}

// ══ OGGI ══
function ascoltaOggi() {
  document.getElementById('oggi-titolo').textContent = fmtDataLunga(giornataOggi);
  if (annullaOggi) annullaOggi();
  if (MODALITA_DEMO) { datiOggi = datiDemo(giornataOggi.slice(0, 7)); renderOggi(); return; }
  annullaOggi = db.collection(COLLEZIONE).where('giornata', '==', giornataOggi)
    .onSnapshot(snap => { datiOggi = snap.docs.map(normalizza); renderOggi(); },
      err => { document.getElementById('oggi-lista').innerHTML = '<div class="vuoto" style="color:var(--danger)">Errore: ' + esc(err.message) + '</div>'; });
}

function renderOggi() {
  const adesso = Date.now();
  document.getElementById('oggi-lista').innerHTML = Object.entries(DIPENDENTI).map(([id, d]) => {
    const r = calcolaGiornata(id, giornataOggi, datiOggi, adesso);
    const fasce = fascePreviste(id, giornataOggi);
    const ultimo = r.turni[r.turni.length - 1];
    let stato;
    if (r.ferie) stato = '<span class="pos">🏖️ Ferie</span>';
    else if (r.malattia) stato = '<span class="neg">🤒 Malattia</span>';
    else if (r.inServizio) stato = '<span class="ok">🟢 In servizio dalle ' + oraDi(ultimo.da) + '</span>';
    else if (ultimo) stato = '<span class="muted">🔴 Uscito alle ' + oraDi(ultimo.a) + '</span>';
    else stato = '<span class="muted">' + (fasce.length ? '— Non ancora timbrato' : '💤 Riposo') + '</span>';
    return '<div class="stato-dip"><div><div style="font-weight:600">' + d.nome + '</div>' +
      '<div class="piccolo muted">Previsto: ' + testoFasce(fasce) + '</div>' +
      (r.turni.length ? '<div class="piccolo" style="color:var(--teal-l);margin-top:2px">⏱ ' + fmtDurata(r.lavorati) + ' lavorate · ' + testoTurni(r) + '</div>' : '') +
      (r.anomalie.length ? '<div class="nota-anom">⚠️ ' + r.anomalie.join(' · ') + '</div>' : '') +
      '</div><div style="text-align:right;font-weight:600;font-size:0.85rem">' + stato + '</div></div>';
  }).join('');
}

// ══ REPORT ══
function caricaReport() {
  const mese = document.getElementById('sel-mese').value;
  if (annullaReport) { annullaReport(); annullaReport = null; }
  if (MODALITA_DEMO) {
    if (meseDemoCaricato !== mese) { datiReport = datiDemo(mese); meseDemoCaricato = mese; }
    renderReport();
    return;
  }
  document.getElementById('rep-tabella').innerHTML = '<tr><td class="vuoto">Caricamento…</td></tr>';
  // Un giorno di margine ai bordi: la giornata viene poi ricalcolata sull'ora del server
  annullaReport = db.collection(COLLEZIONE)
    .where('giornata', '>=', aggiungiGiorni(mese + '-01', -1))
    .where('giornata', '<=', mese + '-32')
    .onSnapshot(snap => { datiReport = snap.docs.map(normalizza); renderReport(); },
      err => { document.getElementById('rep-tabella').innerHTML = '<tr><td style="color:var(--danger)">Errore: ' + esc(err.message) + '</td></tr>'; });
}

function testoTurni(r, sep) {
  return r.turni.map(t => oraDi(t.da) + '–' + (t.a ? oraDi(t.a) : '…')).join(sep || ', ');
}

function noteGiorno(r) {
  const n = [];
  if (r.ferie) n.push('Ferie');
  if (r.malattia) n.push('Malattia');
  if (!r.previsti && r.lavorati) n.push('Lavorato nel giorno di riposo');
  if (r.inCorso) n.push('Giornata in corso');
  r.timbrature.filter(t => t.fonte === 'admin').forEach(t =>
    n.push('Aggiunta a mano: ' + t.tipo + (t.tipo === 'entrata' || t.tipo === 'uscita' ? ' ' + oraDi(t.ts) : '') + (t.nota ? ' (' + t.nota + ')' : '')));
  return n;
}

function renderReport() {
  const dipId = document.getElementById('sel-dip').value;
  const mese = document.getElementById('sel-mese').value;
  const {giorni, tot} = calcolaMese(dipId, mese, datiReport, Date.now());
  ultimoReport = {dipId, mese, giorni, tot};

  document.getElementById('rep-kpi').innerHTML = [
    ['Ore previste', fmtDurata(tot.previsti), ''],
    ['Ore lavorate', fmtDurata(tot.lavorati), ''],
    [etichettaExtra(dipId), '+' + fmtDurata(tot.extra), tot.extra ? 'pos' : ''],
    ['Ore mancanti', '−' + fmtDurata(tot.mancanti), tot.mancanti ? 'neg' : ''],
    ['Ferie / Malattia', tot.ferie + ' / ' + tot.malattia + ' gg', ''],
    ['Giorni da controllare', tot.anomalie, tot.anomalie ? 'neg' : 'ok'],
  ].map(([l, v, c]) => '<div class="kpi"><div class="kpi-v ' + c + '">' + v + '</div><div class="kpi-l">' + l + '</div></div>').join('');

  const corpo = giorni.map(r => {
    const dt = dataDaIso(r.giornata);
    const cls = [r.previsti ? '' : 'riposo', r.futura ? 'futura' : '', r.anomalie.length ? 'anomalia' : ''].join(' ');
    const vuota = r.futura || r.inCorso || (!r.previsti && !r.lavorati);
    const diffCella = vuota ? '' :
      '<span class="' + (r.differenza > 0 ? 'pos' : r.differenza < 0 ? 'neg' : 'ok') + '">' + fmtDurata(r.differenza, true) + '</span>';
    const note = noteGiorno(r).map(esc).concat(r.anomalie.map(a => '<span class="nota-anom">⚠️ ' + esc(a) + '</span>'));
    return '<tr class="' + cls + '">' +
      '<td style="white-space:nowrap"><b>' + GIORNI_BREVI[dt.getDay()] + ' ' + dt.getDate() + '</b></td>' +
      '<td class="piccolo">' + testoFasce(fascePreviste(dipId, r.giornata)) + '</td>' +
      '<td style="white-space:nowrap">' + (testoTurni(r, '<br>') || (r.ferie ? '🏖️' : r.malattia ? '🤒' : '')) + '</td>' +
      '<td class="num">' + (r.previsti ? fmtDurata(r.previsti) : '') + '</td>' +
      '<td class="num">' + (r.lavorati ? fmtDurata(r.lavorati) : '') + '</td>' +
      '<td class="num">' + diffCella + '</td>' +
      '<td class="piccolo">' + note.join('<br>') + '</td>' +
      '<td>' + (r.futura ? '' : '<button class="btn btn-o btn-sm" title="Correggi" onclick="apriCorrezione(\'' + r.giornata + '\')">✎</button>') + '</td></tr>';
  }).join('');

  document.getElementById('rep-tabella').innerHTML =
    '<thead><tr><th>Giorno</th><th>Orario previsto</th><th>Timbrature</th><th class="num">Previste</th><th class="num">Lavorate</th><th class="num">Differenza</th><th>Note</th><th></th></tr></thead>' +
    '<tbody>' + corpo + '</tbody>' +
    '<tfoot><tr><td colspan="3">Totale mese</td><td class="num">' + fmtDurata(tot.previsti) + '</td><td class="num">' + fmtDurata(tot.lavorati) + '</td>' +
    '<td class="num"><span class="pos">+' + fmtDurata(tot.extra) + '</span><br><span class="neg">−' + fmtDurata(tot.mancanti) + '</span></td><td colspan="2"></td></tr></tfoot>';

  document.getElementById('rep-note').innerHTML =
    'Ore in h:mm, al minuto, senza arrotondamenti. Differenza = lavorate − previste, giornata per giornata. ' +
    'Le timbrature fino alle ' + pad(ORA_CAMBIO_GIORNATA) + ':00 contano sulla giornata precedente. ' +
    'La giornata in corso entra nei totali il giorno dopo. Ferie e malattia non generano ore mancanti.';

  if (document.getElementById('modale').dataset.giornata) apriCorrezione(document.getElementById('modale').dataset.giornata);
}

// ══ CORREZIONI ══
const NOMI_TIPO = {entrata: '🟢 Entrata', uscita: '🔴 Uscita', ferie: '🏖️ Ferie', malattia: '🤒 Malattia'};

function apriCorrezione(giornata) {
  const dipId = document.getElementById('sel-dip').value;
  const t = datiReport.filter(x => x.dip === dipId && x.giornata === giornata).sort((a, b) => a.ts - b.ts);
  const modale = document.getElementById('modale');
  const bozza = modale.dataset.giornata === giornata && document.getElementById('c-tipo')
    ? {tipo: document.getElementById('c-tipo').value, ora: document.getElementById('c-ora').value, nota: document.getElementById('c-nota').value}
    : {tipo: 'entrata', ora: '', nota: ''};
  modale.dataset.giornata = giornata;
  modale.innerHTML =
    '<div class="modale-bg" onclick="if(event.target===this)chiudiModale()"><div class="modale">' +
    '<div class="card-t">' + DIPENDENTI[dipId].breve + ' — ' + fmtDataLunga(giornata) + '</div>' +
    '<div class="piccolo muted" style="margin-bottom:10px">Previsto: ' + testoFasce(fascePreviste(dipId, giornata)) + '</div>' +
    (t.length ? t.map(x =>
      '<div class="riga ' + x.tipo + '"' + (x.annullata ? ' style="opacity:.45"' : '') + '>' +
      '<span class="riga-t"' + (x.annullata ? ' style="text-decoration:line-through"' : '') + '>' + NOMI_TIPO[x.tipo] +
      (x.fonte === 'admin' ? '<span class="tag tag-admin">a mano</span>' : '') +
      (x.nota ? '<div class="piccolo muted" style="font-weight:400">' + esc(x.nota) + '</div>' : '') + '</span>' +
      '<span class="riga-o">' + (x.tipo === 'entrata' || x.tipo === 'uscita' ? oraDi(x.ts) : '') + '</span>' +
      (x.annullata ? '<span class="piccolo muted">annullata</span>' : '<button class="btn btn-o btn-sm" onclick="annullaTimbratura(\'' + x.id + '\')">Annulla</button>') +
      '</div>').join('') : '<div class="vuoto">Nessuna timbratura</div>') +
    '<div class="card-t" style="margin-top:16px;font-size:0.9rem">Aggiungi a mano</div>' +
    '<div class="form-riga">' +
    '<div><label for="c-tipo">Tipo</label><select id="c-tipo" onchange="aggiornaCampoOra()">' +
    ['entrata', 'uscita', 'ferie', 'malattia'].map(v => '<option value="' + v + '"' + (v === bozza.tipo ? ' selected' : '') + '>' + NOMI_TIPO[v].slice(3) + '</option>').join('') + '</select></div>' +
    '<div id="c-ora-box"><label for="c-ora">Ora</label><input type="time" id="c-ora" value="' + bozza.ora + '"></div></div>' +
    '<label for="c-nota">Motivo (resta nel registro)</label><input id="c-nota" placeholder="es. dimenticata uscita" value="' + esc(bozza.nota) + '">' +
    '<div style="display:flex;gap:8px;margin-top:14px">' +
    '<button class="btn btn-g" style="flex:1" onclick="aggiungiTimbratura(\'' + dipId + '\',\'' + giornata + '\')">Aggiungi</button>' +
    '<button class="btn btn-o" onclick="chiudiModale()">Chiudi</button></div>' +
    '<div class="piccolo muted" style="margin-top:10px">Un orario prima delle ' + pad(ORA_CAMBIO_GIORNATA) + ':00 viene messo sulla notte dopo questa giornata. Annullare non cancella: la timbratura resta visibile barrata.</div>' +
    '</div></div>';
  aggiornaCampoOra();
}
function aggiornaCampoOra() {
  const tipo = document.getElementById('c-tipo').value;
  document.getElementById('c-ora-box').hidden = tipo === 'ferie' || tipo === 'malattia';
}
function chiudiModale() {
  const m = document.getElementById('modale');
  m.innerHTML = '';
  delete m.dataset.giornata;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }

async function aggiungiTimbratura(dipId, giornata) {
  const tipo = document.getElementById('c-tipo').value;
  const ora = document.getElementById('c-ora').value;
  const nota = document.getElementById('c-nota').value.trim();
  const conOra = tipo === 'entrata' || tipo === 'uscita';
  if (conOra && !ora) { mostraToast('Inserisci l\'ora', true); return; }
  const ts = tsDaGiornataOra(giornata, conOra ? ora : '12:00');
  const doc = {dip: dipId, tipo, giornata, tsClient: ts, fonte: 'admin', nota};
  try {
    document.getElementById('c-ora').value = '';
    document.getElementById('c-nota').value = '';
    if (MODALITA_DEMO) {
      datiReport.push(Object.assign({id: 'demo' + Date.now(), ts, tsServer: null, orologioDiverso: false, annullata: false, inAttesa: false}, doc));
      renderReport();
    } else {
      doc.ts = firebase.firestore.Timestamp.fromMillis(ts);
      doc.inseritaIl = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(COLLEZIONE).add(doc);
    }
    mostraToast('Timbratura aggiunta');
  } catch (e) { mostraToast('Errore: ' + e.message, true); }
}

async function annullaTimbratura(id) {
  if (!confirm('Annullare questa timbratura? Resterà visibile barrata.')) return;
  const x = datiReport.find(d => d.id === id);
  try {
    if (MODALITA_DEMO) { x.annullata = true; renderReport(); }
    else await db.collection(COLLEZIONE).doc(id).update({annullata: true, annullataIl: firebase.firestore.FieldValue.serverTimestamp()});
    mostraToast('Timbratura annullata');
  } catch (e) { mostraToast('Errore: ' + e.message, true); }
}

// ══ EXPORT ══
function nomeMese(mese) {
  const s = dataDaIso(mese + '-01').toLocaleDateString('it-IT', {month: 'long', year: 'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function righeExport() {
  const {dipId, mese, giorni, tot} = ultimoReport;
  const righe = giorni.filter(r => !r.futura).map(r => {
    const dt = dataDaIso(r.giornata);
    return [
      GIORNI_BREVI[dt.getDay()] + ' ' + pad(dt.getDate()) + '/' + mese.slice(5, 7),
      testoFasce(fascePreviste(dipId, r.giornata)).replace(/–/g, '-'),
      testoTurni(r).replace(/–/g, '-').replace('…', '...') || (r.ferie ? 'Ferie' : r.malattia ? 'Malattia' : ''),
      r.previsti ? fmtDurata(r.previsti) : '',
      r.lavorati ? fmtDurata(r.lavorati) : '',
      (r.inCorso || (!r.previsti && !r.lavorati)) ? '' : fmtDurata(r.differenza, true).replace('−', '-'),
      noteGiorno(r).concat(r.anomalie.map(a => 'DA CONTROLLARE: ' + a)).join('; ')
    ];
  });
  return {dipId, mese, tot, righe};
}
function sottotitolo() {
  return MODALITA_DEMO ? ' - DATI DEMO' : COLLEZIONE.includes('prova') ? ' - ARCHIVIO DI PROVA' : '';
}

function esportaPDF() {
  if (!ultimoReport) return;
  const {dipId, mese, tot, righe} = righeExport();
  const d = DIPENDENTI[dipId];
  const pdf = new window.jspdf.jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15);
  pdf.text("Ristorante L'Ancora - Registro presenze" + sottotitolo(), 14, 15);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10);
  pdf.text(d.nome + '  |  ' + d.reparto + '  |  Contratto ' + d.oreSett + ' h/settimana  |  ' + nomeMese(mese), 14, 22);
  pdf.text('Previste ' + fmtDurata(tot.previsti) + '    Lavorate ' + fmtDurata(tot.lavorati) + '    ' + etichettaExtra(dipId) + ' +' + fmtDurata(tot.extra) +
    '    Mancanti -' + fmtDurata(tot.mancanti) + '    Ferie ' + tot.ferie + ' gg    Malattia ' + tot.malattia + ' gg', 14, 28);
  pdf.autoTable({
    startY: 33,
    head: [['Giorno', 'Orario previsto', 'Timbrature', 'Previste', 'Lavorate', 'Differenza', 'Note']],
    body: righe,
    foot: [['Totale', '', '', fmtDurata(tot.previsti), fmtDurata(tot.lavorati), '+' + fmtDurata(tot.extra) + ' / -' + fmtDurata(tot.mancanti), '']],
    margin: {left: 14, right: 14, bottom: 12},
    styles: {fontSize: 7, cellPadding: 0.8, overflow: 'linebreak'},
    headStyles: {fillColor: [14, 124, 123]},
    footStyles: {fillColor: [230, 230, 230], textColor: 20},
    columnStyles: {0: {cellWidth: 18}, 1: {cellWidth: 46}, 2: {cellWidth: 46}, 3: {cellWidth: 17, halign: 'right'},
      4: {cellWidth: 17, halign: 'right'}, 5: {cellWidth: 24, halign: 'right'}, 6: {cellWidth: 'auto'}},
  });
  pdf.setFontSize(8);
  pdf.text('Ore in h:mm al minuto. Timbrature fino alle ' + pad(ORA_CAMBIO_GIORNATA) + ':00 attribuite alla giornata precedente. Generato il ' +
    new Date().toLocaleString('it-IT'), 14, pdf.lastAutoTable.finalY + 6);
  pdf.save('Presenze_' + d.breve + '_' + mese + '.pdf');
}

function esportaExcel() {
  if (!ultimoReport) return;
  const {dipId, mese, tot, righe} = righeExport();
  const d = DIPENDENTI[dipId];
  const aoa = [
    ["Ristorante L'Ancora - Registro presenze" + sottotitolo()],
    [d.nome, d.reparto, 'Contratto ' + d.oreSett + ' h/sett.', nomeMese(mese)],
    [],
    ['Giorno', 'Orario previsto', 'Timbrature', 'Previste (h:mm)', 'Lavorate (h:mm)', 'Differenza (h:mm)', 'Note'],
    ...righe,
    [],
    ['Totale ore previste', '', '', fmtDurata(tot.previsti)],
    ['Totale ore lavorate', '', '', '', fmtDurata(tot.lavorati)],
    [etichettaExtra(dipId), '', '', '', '', '+' + fmtDurata(tot.extra)],
    ['Ore mancanti', '', '', '', '', '-' + fmtDurata(tot.mancanti)],
    ['Giorni ferie', tot.ferie], ['Giorni malattia', tot.malattia],
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch: 11}, {wch: 26}, {wch: 26}, {wch: 15}, {wch: 15}, {wch: 17}, {wch: 60}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, nomeMese(mese).slice(0, 31));
  XLSX.writeFile(wb, 'Presenze_' + d.breve + '_' + mese + '.xlsx');
}

// ══ UTILS ══
function copia(testo) {
  navigator.clipboard.writeText(testo).then(() => mostraToast('Link copiato'), () => prompt('Copia il link:', testo));
}
let timerToast;
function mostraToast(msg, errore) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('errore', !!errore);
  el.classList.add('show');
  clearTimeout(timerToast);
  timerToast = setTimeout(() => el.classList.remove('show'), 3000);
}
